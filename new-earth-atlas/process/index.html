<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Process — New Earth Atlas</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
:root{--bg:#FFFFFF; --ink:#000000; --muted:#5C5C5C; --accent:#00FF00; --on-accent:#000000; --marquee:#000000; --marquee-ink:#FFFFFF;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif; --font-body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#000000; --ink:#FFFFFF; --muted:#A6A6A6; color-scheme:dark} }
:root[data-theme="dark"]{--bg:#000000; --ink:#FFFFFF; --muted:#A6A6A6; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:19px; line-height:1.55}
[hidden]{display:none!important}
.marquee{background:var(--marquee); color:var(--marquee-ink); padding:22px 20px 30px}
.topbar{max-width:1100px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; border-bottom:2px solid var(--marquee-ink); padding-bottom:14px}
.wordmark{font-family:var(--font-display); font-weight:800; font-size:30px; text-transform:uppercase; color:transparent; -webkit-text-stroke:1.6px var(--marquee-ink); line-height:1}
.pill{border:2px solid var(--marquee-ink); border-radius:999px; padding:6px 16px; font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--marquee-ink); text-decoration:none; white-space:nowrap}
.pill:hover{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.marquee h1{max-width:1100px; margin:28px auto 0; font-family:var(--font-display); font-weight:800; font-size:clamp(56px,10vw,140px); line-height:.9; text-transform:uppercase}
.marquee h1 .ring{color:var(--accent); border:3px solid var(--accent); border-radius:999px; padding:0 .18em}
main{max-width:1100px; margin:0 auto; padding:40px 20px 72px}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:.06em; text-transform:uppercase}
.eyebrow::before{content:""; width:12px; height:12px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 1.5px var(--ink) inset}
form{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; max-width:560px}
input{flex:1 1 240px; border:2px solid var(--ink); background:var(--bg); color:var(--ink); border-radius:999px; padding:11px 18px; font:inherit}
button{border:2px solid var(--ink); background:var(--ink); color:var(--bg); border-radius:999px; padding:10px 22px; font-family:var(--font-display); font-weight:700; font-size:19px; text-transform:uppercase; cursor:pointer}
button:hover{background:var(--accent); color:var(--on-accent); border-color:var(--ink)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.err{color:#E03131; font-size:16px; margin-top:10px; min-height:1.4em}
.doc h2{font-family:var(--font-display); font-weight:800; font-size:clamp(36px,5vw,64px); line-height:.95; text-transform:uppercase; margin:16px 0 22px; padding-bottom:10px; border-bottom:4px solid var(--ink)}
.doc .meta{color:var(--muted); font-size:16px; margin:0 0 24px}
.doc .draft{max-width:64ch; font-size:21px; line-height:1.6; border-left:6px solid var(--accent); padding:4px 0 4px 22px; margin:0}
.doc .draft p{margin:0 0 1em}
</style>
</head>
<body>
<div class="marquee">
  <div class="topbar"><span class="wordmark">New Earth</span><a class="pill" href="/new-earth-atlas/">← Back to the atlas</a></div>
  <h1>Process <span class="ring">Notes</span></h1>
</div>
<main>
  <section id="lock">
    <span class="eyebrow">Private · password required</span>
    <form id="f" autocomplete="off">
      <label for="pw" style="position:absolute;left:-9999px">Password</label>
      <input id="pw" type="password" placeholder="Password" required>
      <button type="submit">Open</button>
    </form>
    <p class="err" id="err" aria-live="polite"></p>
  </section>
  <article class="doc" id="doc" hidden></article>
</main>
<script>
const SALT="uW1Rip3yLwx9opqa9L/qzQ==", IV="nSIIoZgw0orH+J6D", CT="YQk3x88HXOyFZBwbL3hfZApvCpKV/lFcxRO7YrFLIe2dwDc/xnaw2Xs5rViKCRzhEEKKLH64ZTtnDVjZHE+XSxspkzGYx8gT148s1tjirVwliFieRd7raULwS6OGinKccfQSocHf3u6QSe8IQP5fEWcfEZ1vwfkK6ld9v+fqxMmHTz8F2sciVO7sSGiNnbgDqD1Og2YvtDhWx+1cJYZNO68ENambsGsu4c8EI7QrYdMXBz4hv/Gz3Z7HAFNVwMMWtJgAhZznx7lQeNC4bNxR9xu/BU/8YmollugZ7Hw8W1SCh7lM+/1PkSNczJGgKSJMffi16eT71EjwhgfaF3y9Be0ozMcMJw1BuN74MbXWfW9EW50JkXxKZHWxPRjJvb8shUx1iOekWx32wbbCRQkJejoww5/V/5mfozm49jRYM95D5B3jcpWeIFL76DfDMec5In4sn4z7Xyq6JbWZeH73D3p6PFXkRfrnOpSV53id1TnlQCFGuCnNHmW+GDBIPLOTJqlFKVcifTHNR74M/Ypxw9iavawUr/+q+LvQyY02rgcl5sdpdPOelJ5j1+16+21HRrEfOzUzQYeZCDOSPJeZnPvGkLaSvqDtmAFOblS6VAJ5kz0alP71NMmiMo1J/aS/9jJEWdX7HctosJbcDW7TLQw+dfRz7h27oJsDAiEBCDR7Oma+auqFIOnSzzfK1IDSiCBXDuWjQC14VLwD+eBrGiMzB5eDlVMRaiLuNvTCj4rqvRkY2B2PMQmLVB8BAjAoIw5jMwhLC8aTkVqRHA==", ITER=600000;
const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err"); err.textContent="";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(IV)},key,d(CT));
    const doc=document.getElementById("doc");
    doc.innerHTML=new TextDecoder().decode(pt); doc.hidden=false;
    document.getElementById("lock").hidden=true;
  }catch(x){ err.textContent="That password didn’t work. Check it and try again."; }
});
</script>
</body>
</html>
