<section class="head"><p class="crumb"><a href="/">Archive</a> / Tag</p><h1>#essay</h1><p class="lede">1 posts</p></section><section class="year" data-year="2014"><h2 class="yr">2014 <span>1</span></h2><div class="grid"><a class="card" href="/blog/2015/1/20/ecological-synergies-a-model-for-a-better-world-final-paper-in-design-for-the-21st-century/" data-search="ecological synergies: a model for a better world design theory essay final paper for design for 21st century. final paper in 1968 the first whole earth catalog was published. in 2014 we need to begin publishing the whole universe catalog. during a time of tremendous social and political change in the world the whole earth catalog provided a “variety of tools accessible to newly dispersed counterculture communities, back-to-the-land households, and innovators in the fields of technology, design, and architecture, and to create a community meeting-place in print.” the catalog became symbolic of a social movement predicated on ecological ideals similar to those that i have outlined in this paper. unfortunately, humanity today faces far greater problems than socio-political concerns. today we face global, ecological catastrophe and the potential extinction of the human race. we need to eradicate our way of life and change how we think of acting in the world and how we deal with objects by shifting our perception to “matters of concern.” we need a revolution. we need a philosophical “reboot” that will fundamentally alter our emotional connection to each other, to the planet, and to the cosmos. perhaps such a cultural symbol—a whole universe catalog—will help shepherd us into a new age. our only hope of survival is through ecological synergy and the realization of how utterly interconnected we all are."><div class="thumb"><div class="noimg"></div><span class="pill">Dec 13, 2014</span></div><h3>Ecological Synergies: A Model for a Better World</h3><p class="meta">Design Theory</p></a></div></section>
